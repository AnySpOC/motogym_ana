<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101214" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gym Ana" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Gym Ana - &#12472;&#12512;&#12459;&#12540;&#12490;&#35336;&#28204;</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <div>
          <p class="eyebrow">iPhone sensor timing</p>
          <h1>Gym Ana</h1>
          <p class="lead">iPhone&#20869;&#34101;&#12475;&#12531;&#12469;&#12384;&#12369;&#12391;&#30330;&#36914;&#12289;&#20572;&#27490;&#12289;&#21152;&#28187;&#36895;&#12289;&#12496;&#12531;&#12463;&#12289;&#26059;&#22238;&#12434;&#26908;&#30693;&#12375;&#12289;1&#26412;&#12372;&#12392;&#12398;&#36208;&#34892;&#12525;&#12464;&#12395;&#12414;&#12392;&#12417;&#12414;&#12377;&#12290;</p>
        </div>
        <div class="status-card">
          <span id="sensorStatus" class="status-dot idle"></span>
          <div>
            <p class="status-label">&#29366;&#24907;</p>
            <strong id="rideState">&#24453;&#27231;&#20013;</strong>
          </div>
        </div>
      </section>

      <section class="timer-panel" aria-label="timer">
        <div class="timer-readout">
          <span>RUN TIME</span>
          <strong id="timer">00.000</strong>
        </div>
        <div class="controls">
          <button id="permissionButton" class="primary" type="button">&#12475;&#12531;&#12469;&#35377;&#21487;</button>
          <button id="armButton" type="button">&#35336;&#28204;&#24453;&#27231;</button>
          <button id="stopButton" type="button">&#25163;&#21205;&#20572;&#27490;</button>
          <button id="demoButton" type="button">&#12487;&#12514;&#20877;&#29983;</button>
        </div>
      </section>

      <section class="metrics-grid" aria-label="sensor metrics">
        <article>
          <span>&#21069;&#24460;G</span>
          <strong id="longG">0.00 g</strong>
        </article>
        <article>
          <span>&#24038;&#21491;G</span>
          <strong id="latG">0.00 g</strong>
        </article>
        <article>
          <span>&#25512;&#23450;&#36895;&#24230;</span>
          <strong id="speed">0.0 km/h</strong>
        </article>
        <article>
          <span>&#12496;&#12531;&#12463;&#35282;</span>
          <strong id="bank">0 deg</strong>
        </article>
        <article>
          <span>&#12520;&#12540;&#12524;&#12540;&#12488;</span>
          <strong id="yaw">0 deg/s</strong>
        </article>
        <article>
          <span>&#20449;&#38972;&#24230;</span>
          <strong id="confidence">0%</strong>
        </article>
      </section>

      <section class="workbench">
        <div class="trace-panel">
          <div class="panel-title">
            <h2>&#36208;&#34892;&#12488;&#12524;&#12540;&#12473;</h2>
            <button id="clearButton" type="button">&#12463;&#12522;&#12450;</button>
          </div>
          <canvas id="traceCanvas" width="960" height="320" aria-label="trace"></canvas>
        </div>
        <div class="event-panel">
          <div class="panel-title">
            <h2>&#12452;&#12505;&#12531;&#12488;&#12525;&#12464;</h2>
            <button id="exportButton" type="button">CSV</button>
          </div>
          <ol id="eventLog" class="event-log"></ol>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
